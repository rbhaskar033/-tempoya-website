name: TEMPOYA Firestore Rules Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/booking-security-followup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx firebase emulators:exec --only firestore --project demo-tempoya-rules "npm run test:rules"
